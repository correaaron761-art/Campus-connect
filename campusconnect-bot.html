<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJEC CampusConnect - Ask Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            position: relative;
            max-width: 900px;
            height: 90vh;
            margin: 5vh auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 20px 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .chat-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120,119,198,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,119,198,0.1) 0%, transparent 50%),
                linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 2px solid #e0e6ed;
            border-bottom-left-radius: 5px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            color: #666;
            font-style: italic;
        }

        .typing-indicator span {
            background: #4CAF50;
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        .chat-input-container {
            padding: 25px 30px;
            background: white;
            border-top: 1px solid #e0e6ed;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }

        .chat-input {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #messageInput {
            flex: 1;
            padding: 15px 25px;
            border: 2px solid #e0e6ed;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        #messageInput:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
            transform: translateY(-2px);
        }

        #sendBtn {
            width: 55px;
            height: 55px;
            border: none;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        #sendBtn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
        }

        #sendBtn:active {
            transform: translateY(-1px);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(76, 175, 80, 0.05);
            border-radius: 15px;
        }

        .feature-btn {
            padding: 10px 15px;
            background: rgba(255,255,255,0.8);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .feature-btn:hover {
            background: #4CAF50;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 95vh;
                margin: 2.5vh;
                border-radius: 20px;
            }
            .chat-header h1 { font-size: 24px; }
            .message-content { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🚀 CampusConnect Bot</h1>
            <p>Your SJEC Digital ID & Academic Assistant</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    👋 Welcome to <strong>SJEC CampusConnect</strong>!<br>
                    Ask about <strong>attendance, notices, events, fees</strong> or click quick buttons below! 😊
                </div>
            </div>
        </div>

        <div class="features-grid">
            <button class="feature-btn" onclick="quickReply('attendance')">Attendance</button>
            <button class="feature-btn" onclick="quickReply('notices')">Notices</button>
            <button class="feature-btn" onclick="quickReply('events')">Events</button>
            <button class="feature-btn" onclick="quickReply('fees')">Fees</button>
            <button class="feature-btn" onclick="quickReply('id')">My ID</button>
            <button class="feature-btn" onclick="quickReply('results')">Results</button>
            <button class="feature-btn" onclick="quickReply('help')">Help</button>
        </div>

        <div class="chat-input-container">
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Ask about attendance, fees, events..." autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // CampusConnect Knowledge Base (from your PBL project)
        const KNOWLEDGE_BASE = {
            'attendance': '✅ Attendance: Scan Digital ID for auto-marking. Status: Present (Demo). View full records at campusconnect.sjec.edu.in/attendance',
            'notices': '📢 Latest: 1) Exam timetable out 2) Fest registration open 3) Fee deadline Jan 10. Full list: campusconnect.sjec.edu.in/notices',
            'events': '🎉 Upcoming: Treasure Hunt (Jan 5), Dance Workshop (Jan 8), Placements (Jan 15). Register now!',
            'fees': '💰 Fees: ₹15,000 pending (Demo). Pay via portal. Last date: Jan 10, 2026.',
            'id': '🆔 Digital ID Active! Use QR for entry/attendance/hostel. Lost? Contact admin.',
            'results': '📊 Sem 3: CGPA 8.2 (Demo). Full marks at campusconnect.sjec.edu.in/results',
            'library': '📚 5 books issued, 2 overdue. Renew online via Digital ID.',
            'placement': '💼 75% placed. TCS drive Jan 15. Update resume in portal!',
            'help': 'Commands: attendance, notices, events, fees, id, results, library, placement'
        };

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim().toLowerCase();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Show typing
            showTyping();

            // Simulate bot response
            setTimeout(() => {
                hideTyping();
                const response = getBotResponse(message);
                addMessage(response, 'bot');
            }, 800);
        }

        function quickReply(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        function getBotResponse(message) {
            for (let key in KNOWLEDGE_BASE) {
                if (message.includes(key)) {
                    return KNOWLEDGE_BASE[key];
                }
            }
            return 'Try: attendance, notices, events, fees, id, results or click quick buttons! 💚';
        }

        function addMessage(text, sender) {
            const messages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const messages = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing';
            typingDiv.className = 'message bot typing-indicator';
            typingDiv.innerHTML = 'CampusConnect is typing<span></span><span></span><span></span>';
            messages.appendChild(typingDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        // Enter key support
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
