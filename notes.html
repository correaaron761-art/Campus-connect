<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Notes - CampusConnect SJEC</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        .container { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .panel { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .upload-area { border: 3px dashed #007bff; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover, .upload-area.dragover { border-color: #0056b3; background: #e7f3ff; }
        .file-list { max-height: 400px; overflow-y: auto; }
        .note-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .note-item:hover { background: #f8f9fa; }
        .download-btn { background: #28a745; color: white; padding: 8px 16px; border: none; border-radius: 20px; cursor: pointer; }
        .delete-btn { background: #dc3545; color: white; padding: 8px 12px; border: none; border-radius: 15px; cursor: pointer; font-size: 12px; }
        .search-box { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 25px; margin-bottom: 20px; font-size: 16px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat { background: #e3f2fd; padding: 10px 20px; border-radius: 20px; text-align: center; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>📚 SJEC Library Notes - CampusConnect</h1>
    <div class="stats">
        <div class="stat">Total Notes: <span id="totalNotes">0</span></div>
        <div class="stat">Downloads: <span id="totalDownloads">0</span></div>
        <div class="stat">Subjects: <span id="totalSubjects">0</span></div>
    </div>
    
    <div class="container">
        <!-- Faculty Upload Panel -->
        <div class="panel">
            <h2>📤 Upload Notes (Faculty)</h2>
            <div class="upload-area" id="uploadArea">
                <p>📁 Drag & drop PDF/DOC notes here</p>
                <p>or <strong>Click to browse</strong></p>
                <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.ppt,.pptx" style="display:none;">
            </div>
            
            <div style="margin-top:20px;">
                <input type="text" id="noteTitle" placeholder="Note Title (e.g., OOP Notes Ch1)" style="width:100%;padding:10px;margin-bottom:10px;">
                <select id="subjectSelect" style="width:100%;padding:10px;margin-bottom:10px;">
                    <option value="CS101">CS101 - Programming</option>
                    <option value="CS102">CS102 - Data Structures</option>
                    <option value="EC201">EC201 - Circuits</option>
                    <option value="MA101">MA101 - Mathematics</option>
                    <option value="PH101">PH101 - Physics</option>
                </select>
                <button onclick="uploadNote()" style="width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:8px;cursor:pointer;">Upload Note</button>
            </div>
            
            <h3>Recent Uploads</h3>
            <div id="recentUploads" class="file-list"></div>
        </div>

        <!-- Student Download Panel -->
        <div class="panel">
            <h2>📥 Student Notes Library</h2>
            <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search notes, subjects...">
            
            <select id="filterSubject" style="padding:10px;margin-bottom:15px;">
                <option value="all">All Subjects</option>
                <option value="CS101">CS101 - Programming</option>
                <option value="CS102">CS102 - Data Structures</option>
                <option value="EC201">EC201 - Circuits</option>
                <option value="MA101">MA101 - Mathematics</option>
                <option value="PH101">PH101 - Physics</option>
            </select>
            
            <div id="notesList" class="file-list"></div>
        </div>
    </div>

    <script>
        // Notes storage
        let notesData = JSON.parse(localStorage.getItem('campusConnectNotes')) || [];
        let downloadStats = JSON.parse(localStorage.getItem('campusConnectDownloads')) || {};

        // Drag & drop upload
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            handleFileSelect(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

        function handleFileSelect(file) {
            if (file) {
                document.getElementById('noteTitle').value = file.name.replace(/\.[^/.]+$/, '');
            }
        }

        // Upload note
        function uploadNote() {
            const title = document.getElementById('noteTitle').value;
            const subject = document.getElementById('subjectSelect').value;
            const file = document.getElementById('fileInput').files[0];

            if (!title || !subject || !file) {
                alert('Please fill all fields and select a file!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const note = {
                    id: 'NOTE' + Date.now(),
                    title,
                    subject,
                    filename: file.name,
                    size: (file.size / 1024).toFixed(1) + ' KB',
                    fileData: e.target.result, // Base64 for demo
                    uploaded: new Date().toLocaleString('en-IN'),
                    downloads: 0,
                    uploader: 'Faculty'
                };

                notesData.unshift(note);
                localStorage.setItem('campusConnectNotes', JSON.stringify(notesData));
                
                document.getElementById('noteTitle').value = '';
                document.getElementById('fileInput').value = '';
                updateAll();
                
                alert('✅ Note uploaded successfully!');
            };
            reader.readAsDataURL(file);
        }

        // Update all displays
        function updateAll() {
            updateStats();
            updateNotesList();
            updateRecentUploads();
        }

        // Stats
        function updateStats() {
            const totalNotes = notesData.length;
            const totalDownloads = Object.values(downloadStats).reduce((a, b) => a + b, 0);
            const subjects = new Set(notesData.map(n => n.subject)).size;
            
            document.getElementById('totalNotes').textContent = totalNotes;
            document.getElementById('totalDownloads').textContent = totalDownloads;
            document.getElementById('totalSubjects').textContent = subjects;
        }

        // Student notes list
        function updateNotesList() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const filter = document.getElementById('filterSubject').value;
            
            const filteredNotes = notesData.filter(note => 
                (!filter || note.subject === filter) &&
                (note.title.toLowerCase().includes(search) || note.subject.includes(search))
            );

            const container = document.getElementById('notesList');
            container.innerHTML = filteredNotes.map(note => `
                <div class="note-item">
                    <div>
                        <strong>${note.title}</strong><br>
                        <small>${note.subject} | ${note.size} | 📥 ${note.downloads} downloads</small>
                    </div>
                    <div>
                        <a href="${note.fileData}" download="${note.filename}" class="download-btn" onclick="trackDownload('${note.id}')">
                            📥 Download
                        </a>
                    </div>
                </div>
            `).join('') || '<p>No notes found. Check uploads section.</p>';
        }

        // Recent faculty uploads
        function updateRecentUploads() {
            const recent = notesData.slice(0, 5).map(note => `
                <div class="note-item">
                    <div>${note.title} (${note.subject})</div>
                    <button class="delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
                </div>
            `).join('');
            
            document.getElementById('recentUploads').innerHTML = recent || '<p>No recent uploads</p>';
        }

        // Track downloads
        function trackDownload(noteId) {
            if (!downloadStats[noteId]) downloadStats[noteId] = 0;
            downloadStats[noteId]++;
            localStorage.setItem('campusConnectDownloads', JSON.stringify(downloadStats));
            updateStats();
        }

        // Delete note
        function deleteNote(noteId) {
            if (confirm('Delete this note?')) {
                notesData = notesData.filter(n => n.id !== noteId);
                localStorage.setItem('campusConnectNotes', JSON.stringify(notesData));
                updateAll();
            }
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', updateNotesList);
        document.getElementById('filterSubject').addEventListener('change', updateNotesList);

        // Initialize
        updateAll();
    </script>
</body>
</html>
